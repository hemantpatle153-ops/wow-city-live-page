name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and check links (custom domain)
        run: node build.mjs --check
      - name: Upload site for InfinityFree
        uses: actions/upload-artifact@v4
        with:
          name: website-htdocs
          path: dist/
          include-hidden-files: true
      - name: Build GitHub Pages preview
        run: SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" node build.mjs --check && mv dist pages-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist/

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  infinityfree:
    # Runs only once the FTP secrets are added in Settings -> Secrets and variables -> Actions.
    needs: build
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.FTP_SERVER != ''
        with:
          name: website-htdocs
          path: dist/
      - name: Upload to InfinityFree over FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /htdocs/
      - name: FTP not configured
        if: env.FTP_SERVER == ''
        run: echo "Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD secrets to deploy to InfinityFree automatically."
