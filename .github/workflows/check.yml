name: Check site

# Cloudflare builds and publishes the site on every push to main (see wrangler.jsonc).
# This workflow only makes sure the build passes and no link is broken.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and check links
        run: node build.mjs --check
